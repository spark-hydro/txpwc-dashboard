name: Streamlit Keepalive

on:
  schedule:
    # Every 12 hours — well inside Streamlit Community Cloud's inactivity
    # sleep window, so the app never has a chance to go to sleep.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Ping app
        env:
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
        run: python .github/scripts/keepalive.py
